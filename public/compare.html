<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaQuant - Quant Screener</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <nav class="navbar glass">
            <a href="/"><i class="fas fa-chart-bar"></i> Bảng Xếp Hạng</a>
            <a href="/compare" class="active"><i class="fas fa-balance-scale"></i> So Sánh Chi Tiết</a>
        </nav>
        <header>
            <h1>AlphaQuant</h1>
            <p>Hệ thống định lượng tìm kiếm siêu cổ phiếu</p>
        </header>

        <div class="control-panel glass" style="display: flex; gap: 1rem; align-items: center; justify-content: center; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; position: relative;">
                <i class="fas fa-search search-icon" style="position: absolute; left: 1rem; color: #94a3b8;"></i>
                <input type="text" id="ticker-input" placeholder="Nhập mã CP (VD: FPT)" style="padding-left: 2.5rem; text-transform: uppercase;">
            </div>
            <div class="peer-inputs-container" style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
                <span style="color: #94a3b8; font-size: 0.9rem;"><i class="fas fa-percent"></i> Thuế:</span>
                <input type="number" id="tax-rate-input" placeholder="0.2" step="0.01" min="0" max="1" style="width: 60px; text-align: center; padding: 0.75rem 0.5rem;">
                <span style="color: #94a3b8; font-size: 0.9rem; margin-left: 0.5rem;"><i class="fas fa-users"></i> Đối thủ:</span>
                <input type="text" class="peer-input" placeholder="Mã 1" style="width: 70px; text-transform: uppercase; text-align: center; padding: 0.75rem 0.5rem;">
                <input type="text" class="peer-input" placeholder="Mã 2" style="width: 70px; text-transform: uppercase; text-align: center; padding: 0.75rem 0.5rem;">
                <input type="text" class="peer-input" placeholder="Mã 3" style="width: 70px; text-transform: uppercase; text-align: center; padding: 0.75rem 0.5rem;">
            </div>
            <button id="run-btn">
                <span class="btn-text">Phân tích</span>
                <div class="spinner" style="display: none;"></div>
            </button>
        </div>

        <div class="status-message" id="status-message"></div>

        <div class="report-container glass" id="report-container" style="display: none;">
            <div id="company-info" style="text-align: center; margin-bottom: 2rem;"></div>
            
            <!-- Khu vực xếp hạng -->
            <div id="ranking-container" style="margin-bottom: 2rem; display: none;">
                <h3 style="color: var(--text-color); margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;"><i class="fas fa-trophy" style="color: #fbbf24;"></i> Xếp hạng Sức mạnh</h3>
                <div class="table-responsive" style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: center; font-size: 0.95rem;">
                        <thead id="ranking-header">
                            <tr style="background: rgba(255,255,255,0.05); color: #94a3b8;">
                                <th style="padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">Xếp hạng</th>
                                <th style="padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">Mã CP</th>
                                <th style="padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">Tổng điểm</th>
                                <th style="padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">ROIC (5Y)</th>
                                <th style="padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">ROIC (TTM)</th>
                                <th style="padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">B/P (5Y)</th>
                                <th style="padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">CFO/NI (TTM)</th>
                                <th style="padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">D/E (Cur)</th>
                                <th style="padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">P/B (Cur)</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-body">
                            <!-- JS will populate this -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="summary-cards" id="summary-cards">
                <!-- Summary will be injected here -->
            </div>
            
            <div class="charts-grid">
                <div class="chart-wrapper">
                    <canvas id="roicChart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="deChart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="cfChart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="bpChart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="icrChart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="epChart"></canvas>
                </div>
            </div>

            <div id="copy-container" style="text-align: center; margin-top: 2rem;">
                <button id="copy-report-btn" style="padding: 0.8rem 2rem; border-radius: 8px; border: 1px solid var(--primary-color); background: rgba(56, 189, 248, 0.1); color: var(--text-color); font-size: 1rem; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; margin: 0 auto;">
                    <i class="fas fa-file-export"></i> Xuất dữ liệu cho AI (JSON)
                </button>
            </div>
        </div>
    </div>

    <script src="script.js?v=9"></script>
</body>
</html>
