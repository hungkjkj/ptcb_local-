<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị Danh mục Ngành - Exceptional Trader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .admin-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .group-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .group-title-input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.3);
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
            font-family: inherit;
            padding: 5px;
            width: 300px;
            transition: all 0.3s ease;
        }
        .group-title-input:focus {
            outline: none;
            border-bottom-color: var(--primary-light);
        }
        .btn-remove-group {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-remove-group:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        .tickers-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
        }
        .tickers-input:focus {
            outline: none;
            border-color: var(--primary-light);
            color: var(--text-primary);
        }
        .input-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }
        .admin-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn-add {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-add:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-save {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        .btn-save:hover {
            transform: translateY(-2px);
        }
        .btn-sync {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-sync:hover {
            background: rgba(16, 185, 129, 0.2);
        }
        .nav-back {
            display: inline-flex;
            align-items: center;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 14px;
            transition: color 0.2s;
            padding-top: 20px;
        }
        .nav-back:hover {
            color: var(--primary-light);
        }
        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            margin-bottom: 20px;
        }
        .status-msg.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: block;
        }
        .status-msg.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="nav-back">← Quay lại Bảng xếp hạng</a>
    
    <div class="admin-container">
        <div class="admin-header">
            <h1>Quản trị Nhóm Ngành</h1>
            <div style="display: flex; gap: 10px;">
                <button class="btn-sync" id="btnSync">Đồng Bộ Dữ Liệu</button>
                <button class="btn-save" id="btnSave">Lưu Cấu Hình</button>
            </div>
        </div>
        
        <div id="statusMessage" class="status-msg"></div>

        <div id="groupsContainer">
            <!-- Groups injected via JS -->
        </div>

        <button class="btn-add" id="btnAddGroup">+ Thêm Nhóm Mới</button>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
